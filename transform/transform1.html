<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            width: 430px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 100px;
            gap: 10px;
        }

        .container>.box {
            background: lightblue;
            width: 100%;
        }

        .container>.box:nth-child(2) {
            grid-column: span 2;
        }

        .container>.box:nth-child(4) {
            grid-row: span 2;
        }

        .container>.box:nth-child(5) {
            grid-row: span 2;
            grid-column: span 2;

        }

        .container>.box:nth-child(5) img {
            object-fit: cover;
            transform: scale(0.5) translate(25%, 25%) rotate(45deg);
        }

        .container>.box:nth-child(6) {
            grid-row: span 2;
        }

        .container>.box:nth-child(8) {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- .box*9-->
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box">
            <img src="https://picsum.photos/210?1" alt="">
        </div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
