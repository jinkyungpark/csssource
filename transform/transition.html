<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square {
            width: 124px;
            height: 124px;
            border-radius: 10%;
            position: absolute;
            top: 108px;
            left: 24px;

            transition: left 1s ease-in-out 1s, transform 1s, background-color 1s;
        }

        /* 오른쪽으로 이동 */
        #left:not(:checked)~div {
            left: 24px
        }

        #left:checked~div {
            left: 400px;
        }

        /* 파랑색으로 체크, 체크해제 */

        #color:not(:checked)~div {
            background-color: tomato;
        }

        #color:checked~div {
            background-color: dodgerblue;
        }

        /* 작게 회전 체크, 체크해제 */

        #trans:not(:checked)~div {
            transform: scale(1) rotate(0deg);
        }

        #trans:checked~div {
            transform: scale(0.5) rotate(360deg);
        }
    </style>
</head>

<body>
    <input type="checkbox" name="" id="left">
    <label for="left">오른쪽으로 이동</label>
    <input type="checkbox" name="" id="color">
    <label for="color">파랑색으로</label>
    <input type="checkbox" name="" id="trans">
    <label for="trans">작게 회전</label>
    <div id="square"></div>
</body>

</html>
